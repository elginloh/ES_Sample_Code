# Grafana settings for the CSC14 telemetry dashboard.
# Paths, address, port and the admin password are passed as GF_* environment
# variables by bin/csc14 (or the systemd unit), from telemetry/.env.

[dashboards]
# The dashboard refreshes every 5 s; this is Grafana's default minimum too.
min_refresh_interval = 5s

[auth.anonymous]
# GF_AUTH_ANONYMOUS_ENABLED (CSC14_GRAFANA_ANONYMOUS) switches this on
org_role = Viewer

[users]
default_theme = system

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[plugins]
# Only the built-in PostgreSQL data source is used; never download plugins
preinstall_disabled = true

[log]
mode = file
level = warn

[log.file]
daily_rotate = true
max_days = 7
