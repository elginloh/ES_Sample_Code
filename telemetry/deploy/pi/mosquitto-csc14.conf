# /etc/mosquitto/conf.d/csc14.conf on the Raspberry Pi.
# The Pico connects without a user name or password (mqtt_utk.c sets only
# a client id), so the listener must allow anonymous clients.  Anyone on
# the same network can then publish and subscribe: use a private network
# (the team's hotspot or router), not a public Wi-Fi.
listener 1883
allow_anonymous true
# Nothing needs to survive a broker restart: robot frames are QoS 0
persistence false
